<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="cc"><circle cx="256" cy="256" r="241"/></clipPath>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wine-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="bg" cx="50%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#3a1010"/>
      <stop offset="55%"  stop-color="#190708"/>
      <stop offset="100%" stop-color="#060203"/>
    </radialGradient>
    <linearGradient id="wine" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#cc2848"/>
      <stop offset="35%"  stop-color="#8c0018"/>
      <stop offset="100%" stop-color="#380008"/>
    </linearGradient>
    <radialGradient id="wine-surf" cx="44%" cy="28%" r="58%">
      <stop offset="0%"   stop-color="#e84068" stop-opacity="1"/>
      <stop offset="100%" stop-color="#900020" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#8a5a28"/>
      <stop offset="40%"  stop-color="#6a3e18"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe566"/>
      <stop offset="20%"  stop-color="#c89b3c"/>
      <stop offset="45%"  stop-color="#ffd700"/>
      <stop offset="65%"  stop-color="#b88a2c"/>
      <stop offset="85%"  stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#a07020"/>
    </linearGradient>
    <radialGradient id="atmo" cx="50%" cy="52%" r="46%">
      <stop offset="0%"   stop-color="#c02040" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#600010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#280608"/>
      <stop offset="100%" stop-color="#100204"/>
    </linearGradient>
  </defs>

